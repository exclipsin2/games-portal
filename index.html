<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games Portal - Play Free Games Online</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Navigation -->
        <nav class="navbar">
            <div class="nav-content">
                <div class="logo">🎮 Games Portal</div>
                <div class="nav-links">
                    <a href="index.html" class="active">Games</a>
                    <a href="proxy.html">Proxy</a>
                    <a href="#about">About</a>
                </div>
            </div>
        </nav>

        <!-- Hero Section -->
        <section class="hero">
            <h1>Play Free Games Online</h1>
            <p>Enjoy 100+ open-source games. No downloads required.</p>
            <input type="text" id="searchBox" class="search-box" placeholder="Search games...">
        </section>

        <!-- Filter Section -->
        <section class="filters">
            <button class="filter-btn active" data-filter="all">All Games</button>
            <button class="filter-btn" data-filter="puzzle">Puzzle</button>
            <button class="filter-btn" data-filter="action">Action</button>
            <button class="filter-btn" data-filter="multiplayer">Multiplayer</button>
            <button class="filter-btn" data-filter="arcade">Arcade</button>
            <button class="filter-btn" data-filter="strategy">Strategy</button>
        </section>

        <!-- Games Grid -->
        <section class="games-grid" id="gamesGrid">
            <!-- Games will be inserted here -->
        </section>

        <!-- Game Modal -->
        <div id="gameModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2 id="modalTitle"></h2>
                <p id="modalDescription"></p>
                <iframe id="gameFrame" class="game-frame" frameborder="0" allow="autoplay"></iframe>
                <div class="modal-footer">
                    <p id="modalControls" style="font-size: 12px; color: #666;"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="games.js"></script>
    <script src="app.js"></script>
</body>
</html>
